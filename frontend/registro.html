<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROGO · Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
<div class="register-layout">

  <main class="register-card">
    <div class="brand"><span class="brand-logo">R</span><span class="brand-name">Soluciones ROGO</span></div>
    <a class="back-link" href="index.html">← Volver al inicio</a>

    <h1>Crear tu cuenta <small class="required-note"><span class="required">*</span> Campo obligatorio</small></h1>
    <p class="muted">Después podrás crear tu primer proyecto.</p>

    <form id="form-register" class="auth-form" novalidate>
      <div class="alert" role="alert" hidden></div>

      <button type="button" class="btn-secondary btn-google" data-google>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.9-6.2A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
        Continuar con Google
      </button>

      <div class="divider">o con tu email</div>

      <div class="field">
        <label for="register-name">Nombre completo <span class="required">*</span></label>
        <input type="text" id="register-name" name="nombre" placeholder="María Elena García" autocomplete="name" aria-describedby="register-name-error" required>
        <p class="field-error" id="register-name-error" hidden></p>
      </div>

      <div class="field">
        <label for="register-email">Email <span class="required">*</span></label>
        <input type="email" id="register-email" name="email" placeholder="maria.elena@gmail.com" autocomplete="email" aria-describedby="register-email-error" required>
        <p class="field-error" id="register-email-error" hidden></p>
      </div>

      <div class="field">
        <label for="register-password">Contraseña <span class="required">*</span></label>
        <div class="password-wrap">
          <input type="password" id="register-password" name="contrasena" autocomplete="new-password" aria-describedby="register-password-error" required>
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <ul class="password-rules" id="password-rules">
          <li data-rule="length">Mínimo 8 caracteres</li>
          <li data-rule="upper">Una letra mayúscula</li>
          <li data-rule="number">Un número</li>
        </ul>
        <p class="field-error" id="register-password-error" hidden></p>
      </div>

      <div class="field">
        <label for="register-password2">Confirmar contraseña <span class="required">*</span></label>
        <div class="password-wrap">
          <input type="password" id="register-password2" autocomplete="new-password" aria-describedby="register-password2-error" required>
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field-error" id="register-password2-error" hidden></p>
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="register-terms" aria-describedby="register-terms-error" required>
          <span>Acepto los <a class="link" href="#">Términos y condiciones</a> y la <a class="link" href="#">Política de privacidad</a></span>
        </label>
        <p class="field-error" id="register-terms-error" hidden></p>
      </div>

      <button type="submit" class="btn-primary btn-block">Crear cuenta</button>
    </form>

    <p class="switch-auth">¿Ya tienes cuenta? <a class="link" href="login.html">Iniciar sesión</a></p>
  </main>

  <aside class="register-art">
    <!-- Exportar desde Figma (pantalla 01, ilustración del móvil) como frontend/img/registro-ilustracion.png -->
    <img src="img/registro-ilustracion.png" alt="">
  </aside>

</div>

<script src="js/auth.js"></script>
</body>
</html>
